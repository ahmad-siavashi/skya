[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skya"
version = "1.0.0"
description = "A pure-Python discrete-event cloud simulator for research on VM placement, scheduling, live migration, and energy efficiency"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad Siavashi", email = "a.siavashi@outlook.com" }]
keywords = ["cloud", "simulation", "research", "scheduling", "placement"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
docs = ["pydoctor"]

[project.urls]
Homepage = "https://github.com/ahmad-siavashi/skya"
Issues = "https://github.com/ahmad-siavashi/skya/issues"

[tool.setuptools.packages.find]
include = ["skya*"]
